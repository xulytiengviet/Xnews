name: Xnews monitor and Pages
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: xnews-production
  cancel-in-progress: false
jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    outputs:
      collector: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Collect X posts
        id: collect
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python monitor.py
      - name: Save data and checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tweets.json state/checkpoints.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update X feed and collector state'
            git push
          fi
      - name: Prepare public dashboard only
        run: |
          mkdir -p public
          cp index.html style.css app.js accounts.json topics.json tweets.json public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report collector errors after publishing status
        if: needs.collect-and-build.outputs.collector == 'failure'
        run: |
          echo 'Collector failed; inspect dashboard status and API access.'
          exit 1
